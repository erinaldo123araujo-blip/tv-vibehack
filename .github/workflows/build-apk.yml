name: Build launcher APK

# Roda manualmente: aba Actions -> "Build launcher APK" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner já traz o Android SDK instalado (ANDROID_HOME), então não
      # precisa da action setup-android (ela quebrou ao tentar instalar "tools").
      - name: Instalar plataforma e build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      # Configuração para o Elsys Smarty eTRI01 (Android TV 9, 1 GB RAM):
      # dock com Netflix, Prime Video, YouTube e Globoplay (os 4 pré-instalados).
      # Apps que não existirem no aparelho são ignorados, então listo mais de um
      # nome de pacote possível para o Globoplay. Sem sintonizador de TV (é um
      # receptor via internet), então live_tv_package fica vazio.
      - name: Configurar launcher
        run: |
          cat > launcher/app/src/main/res/values/config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="dock_apps">
                  <item>com.netflix.ninja</item>
                  <item>com.amazon.amazonvideo.livingroom</item>
                  <item>com.google.android.youtube.tv</item>
                  <item>com.globo.globotv</item>
                  <item>com.globo.globotv.tv</item>
              </string-array>
              <string-array name="hidden_apps">
              </string-array>
              <string name="live_tv_package" translatable="false"></string>
              <integer name="columns">4</integer>
          </resources>
          EOF

      - name: Compilar
        working-directory: launcher
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
